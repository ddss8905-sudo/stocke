name: Scan 224-day opening gaps

on:
  workflow_dispatch:
    inputs:
      market:
        description: Market
        required: true
        default: KOSPI_API
        type: choice
        options: [KOSPI_API, KOSDAQ, NASDAQ]
      mode:
        description: Operation (test-telegram sends a connection test only)
        required: true
        default: scan
        type: choice
        options: [scan, prepare, reconcile, test-telegram]
  schedule:
    - cron: '7 8 * * 1-5'
      timezone: Asia/Seoul
    - cron: '5,15,30 9,10 * * 1-5'
      timezone: Asia/Seoul
    - cron: '55 16 * * 1-5'
      timezone: Asia/Seoul
    - cron: '17 8 * * 1-5'
      timezone: America/New_York
    - cron: '35,45 9 * * 1-5'
      timezone: America/New_York
    - cron: '0 10 * * 1-5'
      timezone: America/New_York
    - cron: '25 17 * * 1-5'
      timezone: America/New_York

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      markets: ${{ steps.select.outputs.markets }}
    steps:
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          MARKET: ${{ inputs.market }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import json, os
          korean = {'7 8 * * 1-5', '5,15,30 9,10 * * 1-5', '55 16 * * 1-5'}
          market = os.environ.get('MARKET', '')
          if os.environ['EVENT'] == 'workflow_dispatch':
              if market not in ('NASDAQ', 'KOSDAQ', 'KOSPI_API'):
                  raise SystemExit('Invalid market')
              markets = [market]
          else:
              markets = ['KOSPI_API', 'KOSDAQ'] if os.environ['SCHEDULE'] in korean else ['NASDAQ']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('markets=' + json.dumps(markets) + '\n')
          PY

  scan:
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        market: ${{ fromJSON(needs.select.outputs.markets) }}
    concurrency:
      group: gap224-${{ matrix.market }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            jobs/requirements.txt
            jobs/requirements-gap.txt
      - name: Install dependencies
        run: pip install -r jobs/requirements-gap.txt
      - name: Validate screeners before using credentials
        run: python -m unittest discover -s jobs/tests -v
      - name: Run gap scanner
        env:
          MARKET: ${{ matrix.market }}
          MODE: ${{ inputs.mode || 'auto' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_BASE_URL: ${{ secrets.KIS_BASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python jobs/run_gap224.py --market "$MARKET" --mode "$MODE"
